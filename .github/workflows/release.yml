name: Release

# Tag a commit to publish: git tag v1.0.0 && git push origin v1.0.0
# The release is created as a DRAFT, so the notes can be edited before it goes public.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v) { $v = '${{ github.ref_name }}' -replace '^v', '' }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building reshot $v"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Cache pinned FFmpeg package
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\reshot-ffmpeg-cache
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('build/fetch-ffmpeg.ps1') }}

      - name: Fetch pinned FFmpeg
        shell: pwsh
        env:
          RESHOT_FFMPEG_CACHE_DIR: ${{ runner.temp }}\reshot-ffmpeg-cache
        run: pwsh build/fetch-ffmpeg.ps1

      - name: Build release artifacts
        shell: pwsh
        env:
          RESHOT_FFMPEG_CACHE_DIR: ${{ runner.temp }}\reshot-ffmpeg-cache
        run: pwsh build/build-release.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: reshot-${{ steps.version.outputs.value }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: reshot ${{ steps.version.outputs.value }}
          body_path: .github/RELEASE_TEMPLATE.md
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
