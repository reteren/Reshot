[package]
name = "reshot"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reshot-core.workspace = true
reshot-capture.workspace = true
reshot-platform.workspace = true
gpui.workspace = true
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
async-channel = "2"
image = { version = "0.25", default-features = false }
smallvec = "1"
raw-window-handle = "0.6"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

[build-dependencies]
winresource = "0.1"
