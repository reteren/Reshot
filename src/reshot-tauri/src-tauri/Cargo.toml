[package]
name = "reshot-tauri"
version = "1.1.0"
description = "Reshot settings"
authors = ["Reshot"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reshot_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Microphone enumeration must go through the very same WASAPI endpoint API that
# NAudio wraps on the C# side, so the device IDs written to settings.json match.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Devices_FunctionDiscovery",
    # Gates PKEY_Device_FriendlyName and IMMDevice::OpenPropertyStore.
    "Win32_UI_Shell_PropertiesSystem",
    # Rounded window corners (DWMWA_WINDOW_CORNER_PREFERENCE).
    "Win32_Graphics_Dwm",
    # GetAsyncKeyState for PrintScreen capture in the settings UI (WebView2
    # does not deliver that key to JS).
    "Win32_UI_Input_KeyboardAndMouse",
] }

